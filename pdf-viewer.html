<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>문서 보기 | 공정 설비 정보관리 시스템</title>
<style>
  :root{
    --navy:#0a2540;
    --gray-500:#6d7683;
    --gray-300:#d3d8de;
    --gray-100:#f4f6f8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--gray-100);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-user-select:none;
    user-select:none;
  }
  .id-bar{
    background:var(--navy);color:#cdd8e3;font-size:11px;letter-spacing:.03em;
    padding:10px 14px;position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:10px;
  }
  .id-bar .back-btn{
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.1);
    color:#fff;border:none;cursor:pointer;padding:0;
  }
  .id-bar .back-btn:active{background:rgba(255,255,255,.2);}
  .id-bar .id-text{min-width:0;flex:1;}
  .id-bar .fname{color:#fff;font-weight:700;font-size:13px;display:block;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #status{padding:40px 16px;text-align:center;color:var(--gray-500);font-size:13px;}
  #pages{max-width:900px;margin:0 auto;padding:10px 8px 40px;}
  .pg{display:block;margin:0 auto 10px;background:#fff;border:1px solid var(--gray-300);
    box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:100%;height:auto;}
  .pg-err{max-width:900px;margin:0 auto 10px;padding:16px;background:#fff;
    border:1px dashed var(--gray-300);color:var(--gray-500);font-size:12.5px;text-align:center;}
  .notice{max-width:900px;margin:0 auto;padding:0 16px;color:var(--gray-500);font-size:11px;text-align:center;}
</style>
</head>
<body>
<script src="gate.js"></script>
<noscript><style>body{visibility:hidden!important;}</style><div style="position:fixed;inset:0;z-index:999999;background:#0a2540;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.6;">이 페이지는 자바스크립트가 필요합니다.<br>브라우저 설정에서 자바스크립트를 켠 뒤 다시 열어주세요.</div></noscript>

<div class="id-bar">
  <button type="button" class="back-btn" id="backBtn" aria-label="뒤로가기">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="id-text">공정 설비 정보관리 시스템 · 첨부 문서
  <span class="fname" id="fname">불러오는 중…</span></span>
</div>
<div id="status">문서를 불러오는 중입니다…</div>
<div id="pages"></div>
<p class="notice">화면 캡처 방지 등 완전한 다운로드 차단은 아니며, 일반적인 저장 버튼 없이 보기 전용으로 제공됩니다.</p>

<script type="module">
  import * as pdfjsLib from "./pdfjs/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdfjs/pdf.worker.min.mjs";

  var params = new URLSearchParams(location.search);
  var file = params.get("file");
  var statusEl = document.getElementById("status");
  var pagesEl = document.getElementById("pages");
  var fnameEl = document.getElementById("fname");

  // 우클릭/길게 눌러 저장하기 방지 (완전 차단은 아니고 버튼 노출을 줄이는 수준)
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // 뒤로가기 — 같은 탭에서 열렸으므로(2026-09-21부터) 방문 기록이 있으면 그대로 되돌아가고,
  // 주소를 복사해 바로 들어온 경우처럼 기록이 없으면 홈으로 보낸다
  document.getElementById("backBtn").addEventListener("click", function () {
    if (document.referrer && document.referrer.indexOf(location.origin) === 0) {
      history.back();
    } else {
      location.href = "index.html";
    }
  });

  if (!file) {
    statusEl.textContent = "문서 주소가 없습니다.";
  } else {
    var baseName = decodeURIComponent(file).split("/").pop();
    fnameEl.textContent = baseName;
    document.title = baseName + " | 문서 보기";

    // 암호 게이트(1차 + 기술문서는 2차)를 통과한 뒤에 파일을 내려받는다
    await (window.dnkGate && window.dnkGate.ready);

    // 페이지 하나가 멈춰도(드물게 렌더링이 응답 없음 상태에 빠지는 경우) 전체가
    // 무한 로딩으로 보이지 않도록, 페이지마다 제한시간을 두고 넘어간다
    var PAGE_TIMEOUT_MS = 20000;
    function withTimeout(promise, ms) {
      return new Promise(function (resolve, reject) {
        var timer = setTimeout(function () {
          reject(new Error("시간 초과"));
        }, ms);
        promise.then(
          function (v) { clearTimeout(timer); resolve(v); },
          function (e) { clearTimeout(timer); reject(e); }
        );
      });
    }

    pdfjsLib
      .getDocument(file)
      .promise.then(function (pdf) {
        statusEl.style.display = "none";
        var renderNext = function (n) {
          if (n > pdf.numPages) return;
          pdf.getPage(n).then(function (page) {
            var scale = Math.min(2, (Math.min(900, window.innerWidth) - 16) / page.getViewport({ scale: 1 }).width);
            var viewport = page.getViewport({ scale: scale });
            var canvas = document.createElement("canvas");
            canvas.className = "pg";
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            pagesEl.appendChild(canvas);
            withTimeout(page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport }).promise, PAGE_TIMEOUT_MS)
              .then(function () {
                renderNext(n + 1);
              })
              .catch(function () {
                canvas.remove();
                var errBox = document.createElement("div");
                errBox.className = "pg-err";
                errBox.textContent = n + "번째 페이지를 표시하지 못했습니다. 새로고침해서 다시 시도해보세요.";
                pagesEl.appendChild(errBox);
                renderNext(n + 1);
              });
          });
        };
        renderNext(1);
      })
      .catch(function (e) {
        statusEl.textContent = "문서를 불러오지 못했습니다 (" + e.message + ")";
      });
  }
</script>

</body>
</html>
