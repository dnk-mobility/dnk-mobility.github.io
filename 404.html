<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>페이지를 찾을 수 없습니다 | 공정 설비 정보관리 시스템</title>
<style>
  /*
    GitHub Pages가 없는 주소에 대해 자동으로 띄우는 페이지.
    암호 게이트를 걸지 않는다 — 오타로 들어온 사람에게 암호를 묻는 건 의미가 없고,
    이 페이지에는 사내 정보가 전혀 없다.
  */
  :root{
    --navy:#0a2540;
    --accent:#0f6cb0;
    --gray-900:#181d22;
    --gray-500:#6d7683;
    --gray-100:#f4f6f8;
    --line:#d3d8de;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--gray-100);color:var(--gray-900);line-height:1.6;
  }
  .ret{position:relative;width:72px;height:72px;margin-bottom:22px;}
  .ret i{position:absolute;width:18px;height:18px;border:2px solid var(--accent);}
  .ret i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;}
  .ret i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;}
  .ret i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;}
  .ret i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;}
  .code{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;
  }
  h1{margin:0 0 8px;font-size:19px;font-weight:800;letter-spacing:-0.01em;text-align:center;}
  p{margin:0 0 4px;font-size:13.5px;color:var(--gray-500);text-align:center;max-width:340px;}
  a.home{
    margin-top:22px;display:inline-flex;align-items:center;gap:8px;
    background:var(--navy);color:#fff;text-decoration:none;
    padding:12px 20px;border-radius:8px;font-size:14px;font-weight:700;
  }
  footer{
    margin-top:34px;text-align:center;color:var(--gray-500);font-size:11.5px;
    border-top:1px solid var(--line);padding-top:14px;width:100%;max-width:340px;
  }
  footer .brand{font-weight:800;color:var(--navy);font-size:12.5px;margin-bottom:4px;}
</style>
</head>
<body>

<div class="ret">
  <i></i><i></i><i></i><i></i>
  <span class="code">404</span>
</div>

<h1>페이지를 찾을 수 없습니다</h1>
<p>주소가 잘못되었거나 삭제된 페이지입니다.</p>
<p>QR코드가 손상되었을 수 있으니, 아래에서 설비를 직접 선택해 주세요.</p>

<a class="home" href="/">전체 설비 인덱스로 이동 <span aria-hidden="true">›</span></a>

<footer>
  <div class="brand">DnK MOBILITY · 후공정 생산기술팀</div>
  문의는 후공정 생산기술팀으로 부탁드립니다
</footer>

</body>
</html>
